[package]
name = "personal-space"
version = "0.1.0"
description = "Aplicativo pessoal para macOS"
authors = ["Caio"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
ureq = "3"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native"] }
